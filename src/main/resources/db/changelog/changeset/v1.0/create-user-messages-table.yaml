databaseChangeLog:
  - changeSet:
      id: 03-create-user-messages-table
      author: Serge
      changes:
        - createTable if not exist:
            tableName: user_messages
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: registered_at
                  type: datatime
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
